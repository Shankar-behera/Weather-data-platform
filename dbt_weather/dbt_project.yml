name: 'weather_analytics'
version: '1.0.0'

profile: 'weather_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Environment variables
  catalog: weather
  schema: analytics
  
  # Date configuration
  start_date: '2026-06-26'
  
  # Quality thresholds
  quality_min_records: 10
  quality_max_lag_days: 1

models:
  weather_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
      
    # Configure incremental models
    +incremental_strategy: merge
    +unique_key: ['city', 'observation_date']

tests:
  +severity: warn
  +store_failures: true

seeds:
  +schema: seed
  +quote_columns: false

snapshots:
  +target_database: weather
  +target_schema: snapshots
  +unique_key: city
  +strategy: timestamp
  +updated_at: last_updated